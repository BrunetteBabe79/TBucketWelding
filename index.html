<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Custom metal buildings, barndominiums, carports, and steel structures built by hand in the Texas Hill Country. 40+ years of craftsmanship from T Bucket Welding in Burnet, TX.">
  <title>T Bucket Welding | Hill Country Metal Buildings</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* Gentle Floating Animation */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    
    .float-animation {
      animation: float 4s ease-in-out infinite;
    }

    /* --- Theme Variables --- */
    :root {
      --rust: #8B3A1A;
      --rust-light: #C4622D;
      --cream: #F5F0E8;
      --charcoal: #1C1C1A;
      --steel: #4A5568;
      --sand: #D4C5A9;
      --white: #FFFFFF;
      --dark-bg: #141412;
    }

    /* --- Global Resets & Typography --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    a {
      color: inherit;
      text-decoration: none;
    }
    
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Barlow', sans-serif;
      background-color: var(--dark-bg);
      color: var(--cream);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Playfair Display', serif;
      letter-spacing: 0.5px;
    }

    /* --- Interactive UI Elements --- */
    .btn-primary {
      background: linear-gradient(135deg, var(--rust-light), var(--rust));
      color: var(--cream);
      padding: 0.85rem 2rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(139, 58, 26, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(196, 98, 45, 0.5);
    }

    /* Glassmorphism Cards */
    .card {
      background: rgba(28, 28, 26, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 197, 169, 0.15);
      border-radius: 8px;
      padding: 2rem;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }

    .card:hover {
      border-color: var(--rust-light);
      transform: translateY(-5px);
    }

    /* --- Floating Testimonials Marquee --- */
    .testimonials-section {
      overflow: hidden;
      padding: 4rem 0;
      position: relative;
    }

    .testimonial-track {
      display: flex;
      gap: 2rem;
      width: max-content;
      animation: marquee 35s linear infinite;
    }

    .testimonial-track:hover {
      animation-play-state: paused;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .testimonial-card {
      min-width: 320px;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--rust-light);
      padding: 1.5rem;
      border-radius: 0 8px 8px 0;
    }
  </style>
</head>
<body>

  <!-- Website Content Continues Here -->

</body>
</html>
